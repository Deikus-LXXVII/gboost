[package]
name = "wasm-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wasmtime = { version = "=49.0.5", default-features = false, features = ["component-model", "component-model-async", "cranelift", "runtime", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
toml = "=0.9.8"
url = "=2.5.7"

[workspace]

[profile.dev.package."*"]
opt-level = 3
