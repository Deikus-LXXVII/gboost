[package]
name = "approver"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["full"] }
webauthn-rs = { version = "=0.6.2", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = "=0.6.2"
web-push = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4","serde"] }
# web-push needs OpenSSL; build it from source so no system OpenSSL is required (Windows has none).
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
webauthn-authenticator-rs = { version = "=0.6.2", features = ["softpasskey"] }

[workspace]
