[package]
name = "mcp-connector"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
url = "2"
toml = "0.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }

tower-http = { version = "=0.6.11", features = ["timeout"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "0.1"

[workspace]
