[package]
name = "gboost-s9-core"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "gboost_s9_core"
path = "src/lib.rs"

[[bin]]
name = "gboost-s9-core"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
toml = "0.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]

[workspace]
